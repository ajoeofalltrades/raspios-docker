# .github/workflows/lint.yml
name: Lint
on: [pull_request, push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # pull code to job runner
      - uses: actions/checkout@v4

      # check for common Bash errors & consistent Bash formatting
      - name: ShellCheck + shfmt
        id: shell  # make its output easy to reference
        uses: reviewdog/action-shellcheck@v1  # wraps shellcheck 0.9+
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          pattern: 'scripts/**/*.sh'  # or simply '**/*.sh'
          level: warning  # annotate but don’t fail PR

      # run shfmt AFTER shellcheck so diffs are readable
      - name: shfmt (auto-fix)
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          export PATH="$HOME/go/bin:$PATH"
          shfmt -i 2 -w scripts  # -w = write changes; tweak to -d for CI-only
      
      # check for common errors in GitHub Action syntax
      - name: actionlint 
        uses: reviewdog/action-actionlint@v1  # adds PR annotations
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
      
      # check for common Markdown errors
      - name: Markdown lint
        uses: reviewdog/action-markdownlint@v0  # tiny wrapper
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          markdownlint_flags: "*.md docs/**/*.md"
      
      ## check for common makefile errors with checkmake
      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
      - name: Install and run checkmake
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s Makefile ]; then
            curl -sSL -o checkmake "https://github.com/mrtazz/checkmake/releases/latest/download/checkmake_linux_amd64"
            chmod +x checkmake
            if [ ! -x ./checkmake ]; then
              echo "checkmake binary not found or not executable!"
              exit 1
            fi
            file ./checkmake
            output=$(./checkmake Makefile 2>&1)
            if [ -n "$output" ]; then
              echo "$output" | reviewdog -f=checkstyle -name=checkmake -reporter=github-check
            else
              echo "No checkmake issues found."
            fi
          else
            echo "No non-empty Makefile found, skipping checkmake."
          fi